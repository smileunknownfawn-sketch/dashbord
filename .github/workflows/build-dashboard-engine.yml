name: Build local dashboard engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate engine
        run: python tools/generate_dashboard_engine.py

      - name: Validate Python syntax
        run: |
          python -m py_compile dashboard_engine.py
          python -m py_compile pages/2_Розширена_аналітика.py

      - name: Show line count
        run: |
          echo "dashboard_engine.py lines: $(wc -l < dashboard_engine.py)"
          echo "repository Python lines: $(find . -type f -name '*.py' -not -path './.git/*' -print0 | xargs -0 cat | wc -l)"

      - name: Commit generated engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_engine.py
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build generated dashboard analytics engine"
            git push
          fi
