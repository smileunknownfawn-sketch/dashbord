name: Windows release 1.0.1

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pytest pyinstaller
      - name: Syntax check
        shell: pwsh
        run: python -m compileall -q core desktop_app.py tests
      - name: Automated tests
        shell: pwsh
        run: python -m pytest -q tests
      - name: Build EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean --windowed --onefile --name "Dashboard_1.0.1" desktop_app.py
      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Dashboard_1.0.1.exe")) { throw 'EXE не створено' }
          $size=(Get-Item "dist/Dashboard_1.0.1.exe").Length
          if ($size -lt 100000) { throw 'EXE має підозріло малий розмір' }
          Write-Host "EXE size: $size bytes"
      - name: Publish EXE
        uses: actions/upload-artifact@v4
        with:
          name: Dashboard_1.0.1-Windows
          path: dist/Dashboard_1.0.1.exe
          if-no-files-found: error
