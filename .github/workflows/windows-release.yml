name: Windows release 1.0.1

on:
  workflow_dispatch:
  push:
    branches: [main, build-final-1.0.1]
    tags: ['v*']

env:
  RELEASE_BUILD: '1.0.1'
  RELEASE_ICON: 'ico.png'

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
      - name: Встановити Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Встановити залежності
        shell: pwsh
        run: python -m pip install --upgrade pip pytest pyinstaller pillow
      - name: Синтаксична перевірка
        shell: pwsh
        run: python -m compileall -q core desktop_final.py desktop_modern.py desktop_release.py launcher.py tests
      - name: Перевірити імпорт і аналітику
        shell: pwsh
        run: |
          python -c "import desktop_release, launcher; from core.analytics import year_comparison, month_comparison; print('Імпорт фінального UI: OK'); print(year_comparison([], 2025, 2026)); print(month_comparison([], 2025, 1, 2026, 1))"
      - name: Автоматичні тести
        shell: pwsh
        run: pytest -q
      - name: Підготувати ресурси та іконку
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_assets\assets | Out-Null
          if (!(Test-Path "language-russian.jpg")) { throw "language-russian.jpg не знайдено" }
          if (!(Test-Path "sounds\opiat-rabota.mp3")) { throw "sounds/opiat-rabota.mp3 не знайдено" }
          if (!(Test-Path "ico.png")) { throw "ico.png не знайдено в корені репозиторію" }
          python -c "from PIL import Image; Image.open('language-russian.jpg').convert('RGB').save('build_assets/assets/moskal.png', 'PNG'); im=Image.open('ico.png').convert('RGBA'); im.thumbnail((256,256),Image.Resampling.LANCZOS); im.save('build_assets/dashboard.ico',format='ICO',sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"
      - name: Зібрати EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Dashboard_1.0.1" --icon "build_assets\dashboard.ico" --add-data "sounds;sounds" --add-data "build_assets/assets/moskal.png;assets" --add-data "build_assets/dashboard.ico;assets" launcher.py
      - name: Перевірити EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist\Dashboard_1.0.1.exe")) { throw "EXE не створено" }
          $size=(Get-Item "dist\Dashboard_1.0.1.exe").Length
          if ($size -lt 100000) { throw "EXE має підозріло малий розмір" }
      - name: Встановити Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Зібрати Setup з українською іконкою
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\DashboardIcon.iss
          if (!(Test-Path "installer\output\Дашборд_розпоряджень_1.0.1_Setup.exe")) { throw "Setup не створено" }
      - name: Зберегти EXE
        uses: actions/upload-artifact@v4
        with:
          name: Dashbord-Windows-1.0.1
          path: dist/Dashboard_1.0.1.exe
          if-no-files-found: error
      - name: Зберегти Setup
        uses: actions/upload-artifact@v4
        with:
          name: Dashbord-Setup-1.0.1
          path: installer/output/Дашборд_розпоряджень_1.0.1_Setup.exe
          if-no-files-found: error
