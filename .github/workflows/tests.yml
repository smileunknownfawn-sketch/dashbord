name: Перевірка дашборда

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
      - name: Встановити Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Встановити залежності тестів
        run: python -m pip install --upgrade pip pytest
      - name: Перевірити синтаксис сервісів
        run: python -m compileall -q services
      - name: Запустити тести
        run: pytest -q
