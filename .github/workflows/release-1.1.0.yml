name: Dashboard 1.1.0 full Windows release

on:
  push:
    branches: [dashboard-max-ux-1.1.0]
  workflow_dispatch:

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip pytest pyinstaller pillow
      - name: Syntax check
        shell: pwsh
        run: python -m compileall -q core desktop_final.py desktop_modern.py desktop_release.py desktop_release_v2.py desktop_max.py launcher.py tests
      - name: Tests
        shell: pwsh
        run: pytest -q
      - name: Prepare assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_assets\assets | Out-Null
          if (!(Test-Path "language-russian.jpg")) { throw "language-russian.jpg missing" }
          if (!(Test-Path "ico.png")) { throw "ico.png missing" }
          if (!(Test-Path "sounds\opiat-rabota.mp3")) { throw "sound missing" }
          python -X utf8 -c "from PIL import Image; im=Image.open('language-russian.jpg').convert('RGB'); im.thumbnail((1600,1000),Image.Resampling.LANCZOS); im.save('build_assets/assets/moskal.png','PNG'); icon=Image.open('ico.png').convert('RGBA'); icon.thumbnail((256,256),Image.Resampling.LANCZOS); icon.save('build_assets/dashboard.ico',format='ICO',sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"
      - name: Build EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "Dashboard_1.1.0" --icon "build_assets\dashboard.ico" --add-data "sounds;sounds" --add-data "build_assets/assets/moskal.png;assets" --add-data "language-russian.jpg;assets" --add-data "build_assets/dashboard.ico;assets" launcher.py
      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist\Dashboard_1.1.0.exe")) { throw "EXE missing" }
          if ((Get-Item "dist\Dashboard_1.1.0.exe").Length -lt 100000) { throw "EXE too small" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\DashboardIcon.iss
          if (!(Test-Path "installer\output\Дашборд_розпоряджень_1.1.0_Setup.exe")) { throw "Setup missing" }
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Dashbord-Windows-1.1.0
          path: dist/Dashboard_1.1.0.exe
          if-no-files-found: error
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Dashbord-Setup-1.1.0
          path: installer/output/Дашборд_розпоряджень_1.1.0_Setup.exe
          if-no-files-found: error
